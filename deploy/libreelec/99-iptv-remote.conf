# This receiver advertises tablet capabilities on its media-key interface.
Section "InputClass"
    Identifier "IPTV 1915:1025 consumer keyboard"
    MatchUSBID "1915:1025"
    MatchProduct "USB Composite Device Consumer Control"
    MatchDevicePath "/dev/input/event*"
    Driver "evdev"
    Option "IgnoreAbsoluteAxes" "true"
    Option "IgnoreRelativeAxes" "true"
EndSection
