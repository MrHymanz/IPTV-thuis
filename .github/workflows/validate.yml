name: Validate app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk python3-pil ffmpeg xvfb mpv
      - name: Run tests with a Full HD virtual screen
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python3 -m unittest discover -s tests
      - name: Validate native TV image
        run: docker build --build-arg VCS_REF="${{ github.sha }}" -f deploy/libreelec/Dockerfile -t iptv-thuis-tv:ci .
